# Local dependencies only — the Elixir apps run on the host via `mix phx.server`.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sca
      POSTGRES_PASSWORD: sca
      POSTGRES_DB: sca_dev
    # Non-standard host port so it never fights a system Postgres or sca-proto.
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sca"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
